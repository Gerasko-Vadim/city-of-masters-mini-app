<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <clipPath id="circle">
    <circle cx="50" cy="50" r="48"/>
  </clipPath>

  <g clip-path="url(#circle)">
    <!-- Red background (full) -->
    <rect x="0" y="0" width="100" height="100" fill="#CC1212"/>

    <!-- Dark left segment (vertical chord at x≈38) -->
    <!-- Top-left: dark gray -->
    <path d="M2 50 A48 48 0 0 1 38 4 L38 50 Z" fill="#3a3a3a"/>
    <!-- Bottom-left: black -->
    <path d="M2 50 A48 48 0 0 0 38 96 L38 50 Z" fill="#0a0a0a"/>

    <!-- White chevron arrow pointing right -->
    <path d="M22 28 L55 50 L22 72" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
